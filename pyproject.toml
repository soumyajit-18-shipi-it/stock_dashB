[project]
name = "stock-intelligence-dashboard"
version = "1.0.0"
description = "A production-grade stock analysis and prediction platform"
authors = [
    { name = "Soumyajit Rout", email = "soumyajit@example.com" }
]
license = { text = "AGPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "pandas>=2.2.0,<3.0.0",
    "numpy>=2.2.0,<3.0.0",
    "yfinance==0.2.49",
    "scikit-learn>=1.6.0,<2.0.0",
    "joblib==1.4.2",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.1",
    "supabase>=2.11.0",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # bandit
]
ignore = [
    "B008", # function call in argument defaults (common in FastAPI)
    "S101", # use of assert (common in tests)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "pandas.*",
    "numpy.*",
    "sklearn.*",
    "joblib.*",
    "supabase.*",
    "plotly.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=backend --cov-report=xml --cov-report=term-missing"
testpaths = [
    "backend/tests",
]

[tool.coverage.run]
source = ["backend"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"] # assert_used

[tool.vulture]
exclude = ["tests"]
min_confidence = 80
paths = ["backend"]

[tool.pylint]
max-line-length = 88
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
]
