services:
  - type: web
    name: stock-dashboard-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: APP_ENV
        value: "production"
      - key: FRONTEND_URL
        value: "https://smart-stock18.vercel.app"
      - key: CORS_ORIGINS
        value: "https://smart-stock18.vercel.app"
