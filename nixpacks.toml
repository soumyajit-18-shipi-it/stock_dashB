[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "python312Packages.virtualenv"]

[phases.install]
cmds = [
  "python -m venv .venv",
  "source .venv/bin/activate",
  "pip install -r backend/requirements.txt"
]

[phases.build]
cmds = []

[start]
cmd = "source .venv/bin/activate && uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8000}"