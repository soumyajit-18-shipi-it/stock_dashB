<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <title>Stock Intelligence Dashboard - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(90vw, 520px);
        padding: 24px;
        border: 1px solid #334155;
        border-radius: 12px;
        background: #1e293b;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      p {
        color: #cbd5e1;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        The app shell is available, but fresh stock prices, predictions, AI chat, and reports require a network
        connection to the backend and data providers.
      </p>
    </main>
  </body>
</html>
