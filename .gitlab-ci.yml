stages:
  - format
  - lint
  - type_check
  - security
  - test
  - coverage
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NODE_CACHE_DIR: "$CI_PROJECT_DIR/.cache/npm"

cache:
  paths:
    - .cache/pip
    - frontend/node_modules/

# ---------------------------------------------------------------------------
# FORMAT STAGE
# ---------------------------------------------------------------------------

format:python:
  stage: format
  image: python:3.11-slim
  script:
    - pip install ruff
    - ruff format --check .
    - ruff check .

format:frontend:
  stage: format
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run format:check

# ---------------------------------------------------------------------------
# LINT STAGE
# ---------------------------------------------------------------------------

lint:flake8:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install flake8
    - flake8 backend

lint:pylint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install -r backend/requirements.txt
    - pip install pylint
    - pylint backend || true

lint:frontend:
  stage: lint
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint

# ---------------------------------------------------------------------------
# TYPE CHECK STAGE
# ---------------------------------------------------------------------------

type_check:python:
  stage: type_check
  image: python:3.11-slim
  script:
    - pip install -r backend/requirements.txt
    - pip install mypy types-requests
    - mypy backend

type_check:frontend:
  stage: type_check
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run typecheck

# ---------------------------------------------------------------------------
# SECURITY STAGE
# ---------------------------------------------------------------------------

security:semgrep:
  stage: security
  image:
    name: returntocorp/semgrep:latest
    entrypoint: [""]
  script:
    - semgrep --config .semgrep.yml .
  allow_failure: true

security:gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose
  allow_failure: true

# ---------------------------------------------------------------------------
# TEST STAGE
# ---------------------------------------------------------------------------

test:python:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r backend/requirements.txt
    - pip install pytest pytest-cov
    - pytest backend/tests

test:frontend:
  stage: test
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run test:run

# ---------------------------------------------------------------------------
# COVERAGE STAGE
# ---------------------------------------------------------------------------

coverage:python:
  stage: coverage
  image: python:3.11-slim
  script:
    - pip install -r backend/requirements.txt
    - pip install pytest pytest-cov
    - pytest backend/tests --cov=backend --cov-report=xml --cov-report=term
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'

# ---------------------------------------------------------------------------
# BUILD STAGE
# ---------------------------------------------------------------------------

build:docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
  only:
    - main

# ---------------------------------------------------------------------------
# RELEASE STAGE
# ---------------------------------------------------------------------------

release:tag:
  stage: release
  image: alpine:latest
  script:
    - echo "Generating release artifacts..."
  only:
    - tags