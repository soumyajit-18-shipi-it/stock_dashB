variables:
  GIT_DEPTH: 0
stages:
  - format
  - lint
  - type_check
  - security
  - test
  - coverage
  - data
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NODE_CACHE_DIR: "$CI_PROJECT_DIR/.cache/npm"

cache:
  paths:
    - .cache/pip
    - frontend/node_modules/

# ---------------------------------------------------------------------------
# FORMAT STAGE
# ---------------------------------------------------------------------------

format:python:
  stage: format
  image: python:3.11-slim
  script:
    - pip install ruff
    - ruff format --check .
    - ruff check .

format:frontend:
  stage: format
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run format:check

# ---------------------------------------------------------------------------
# LINT STAGE
# ---------------------------------------------------------------------------

lint:flake8:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install flake8
    - flake8 backend

lint:pylint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install -r backend/requirements.txt
    - pip install pylint
    - pylint backend || true

lint:frontend:
  stage: lint
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint

# ---------------------------------------------------------------------------
# TYPE CHECK STAGE
# ---------------------------------------------------------------------------

type_check:python:
  stage: type_check
  image: python:3.11-slim
  script:
    - pip install -r backend/requirements.txt
    - pip install mypy types-requests
    - mypy backend

type_check:frontend:
  stage: type_check
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run typecheck

# ---------------------------------------------------------------------------
# SECURITY STAGE
# ---------------------------------------------------------------------------

security:semgrep:
  stage: security
  image:
    name: returntocorp/semgrep:latest
    entrypoint: [""]
  script:
    - semgrep --config .semgrep.yml .
  allow_failure: true

security:gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose
  allow_failure: true

# ---------------------------------------------------------------------------
# TEST STAGE
# ---------------------------------------------------------------------------

test:python:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r backend/requirements.txt
    - pip install pytest pytest-cov pytest-asyncio
    - pytest backend/tests

test:frontend:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run test:run

test:pwa-build:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build:pwa

# ---------------------------------------------------------------------------
# DATA / ML SMOKE STAGE
# ---------------------------------------------------------------------------

data:indic-validation:
  stage: data
  image: python:3.11-slim
  script:
    - python scripts/validate_indic_dataset.py
    - python scripts/prepare_indic_dataset.py

data:indic-model-smoke:
  stage: data
  image: python:3.11-slim
  script:
    - pip install scikit-learn joblib
    - python scripts/train_indic_intent_model.py
    - python scripts/evaluate_indic_intent_model.py
  artifacts:
    when: always
    paths:
      - reports/model-evaluation/indic_intent_metrics.json
      - models/indic-intent-classifier/metadata.json

# ---------------------------------------------------------------------------
# COVERAGE STAGE
# ---------------------------------------------------------------------------

coverage:python:
  stage: coverage
  image: python:3.11-slim
  script:
    - pip install -r backend/requirements.txt
    - pip install pytest pytest-cov pytest-asyncio
    - pytest backend/tests --cov=backend --cov-report=xml --cov-report=term
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'

# ---------------------------------------------------------------------------
# BUILD STAGE
# ---------------------------------------------------------------------------

build:docker:
  stage: build
  image: docker:29.0.0
  services:
    - name: docker:29.0.0-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
  only:
    - main
# ---------------------------------------------------------------------------
# RELEASE STAGE
# ---------------------------------------------------------------------------

release:tag:
  stage: release
  image: alpine:latest
  script:
    - echo "Generating release artifacts..."
  only:
    - tags
